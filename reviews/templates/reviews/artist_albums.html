<h1>{{ artist_name }} 的专辑</h1>

<p><a href="{% url 'home' %}">← 返回首页</a></p>

<div style="display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px;">
    {% for album in albums %}
        <div style="width: 200px; text-align: center;">
            <a href="{% url 'album_detail' album.id %}">
                {% if album.cover_url %}
                    <img src="{{ album.cover_url }}" alt="{{ album.title }}" style="width: 100%; border-radius: 4px;">
                {% else %}
                    <div style="width: 100%; height: 200px; background: #eee; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #999;">
                        暂无封面
                    </div>
                {% endif %}
            </a>
            <p><a href="{% url 'album_detail' album.id %}"><strong>{{ album.title }}</strong></a></p>
            <p style="color: #666;">{{ album.release_date|date:"Y" }}</p>
            {% if album.critic_score is not None %}
                <p style="color: #c60;">乐评人评分：{{ album.critic_score }}/100</p>
            {% endif %}
        </div>
    {% empty %}
        <p>暂无专辑记录。</p>
    {% endfor %}
</div>
